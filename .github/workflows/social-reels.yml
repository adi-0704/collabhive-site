name: Social Reels (render video)

# Renders the REEL calendar (social/calendar/reels_calendar.json) as 9:16 MP4s.
# This is the reel stream, which carries different topics to the static feed —
# see social/generate_reels.py.
#
# Runs here rather than locally because the MP4 conversion needs ffmpeg;
# Chromium only produces WebM, which Instagram rejects outright.
#
# Weekly rather than daily: rendering video is slow, and the publisher only
# needs a modest buffer of rendered reels ahead of it. Committed MP4s are served
# by GitHub Pages — that IS the upload step, so a reel must be committed before
# social-reels-publish.yml can post it.
on:
  schedule:
    # Sunday 02:00 UTC — quiet slot, well before the daily reel publish at 14:00.
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      days:
        description: 'How many days ahead to render'
        required: false
        default: '14'

concurrency:
  group: social-reels
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg
        # Not assumed to be present. It was NOT on the runner's PATH, which
        # failed the first run outright — Playwright ships its own private
        # build for recording, but that one is not exposed for our conversion.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Confirm tooling
        run: python -u social/reels.py --check

      - name: Rebuild the reel calendar
        # Cheap, and it keeps the rendered filenames in step with the calendar.
        # The reel anchor is held, so this cannot re-date anything.
        run: python -u social/generate_reels.py

      - name: Render reels
        run: |
          python -u social/reels.py --days "${{ inputs.days || 14 }}"

      - name: Commit rendered reels
        if: always()
        run: |
          git config user.name "collabhive-social"
          git config user.email "collabhive.in@gmail.com"
          git add -A social/calendar/reels/ social/calendar/reels_calendar.json social/calendar/reel_anchor.txt || true
          if git diff --cached --quiet; then
            echo "No new reels to commit."
          else
            git commit -m "build: render Instagram reels [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin "${{ github.ref_name }}" && break || true
            done
            for i in 1 2 3; do
              git push origin "${{ github.ref_name }}" && break || sleep 15
            done
          fi
        shell: bash
