name: Outreach Daily Run

on:
  schedule:
    # India Standard Time = UTC+5:30. Run daily at 09:00 IST.
    # Cron is UTC: 09:00 IST = 03:30 UTC.
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode (default: all = enrich + daily + sales + seo + report)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - daily
          - sales
          - seo
          - report
          - enrich

concurrency:
  group: outreach-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  outreach:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright (for Maps discovery, optional)
        run: |
          pip install playwright >/dev/null 2>&1 || echo "Playwright install skipped"
          playwright install chromium >/dev/null 2>&1 || echo "Chromium / Playwright not available — email run will still work"
        shell: bash

      - name: Run daily outreach
        working-directory: outreach
        env:
          OUTREACH_EMAIL_USER: ${{ secrets.OUTREACH_EMAIL_USER }}
          OUTREACH_EMAIL_PASS: ${{ secrets.OUTREACH_EMAIL_PASS }}
          RUN_MODE: ${{ inputs.mode || 'all' }}
        run: |
          MODE="${{ inputs.mode || 'all' }}"
          python src/run.py "$MODE" || echo "Run finished with warnings (email may be disabled if secrets unset)"
          # Always (re)generate SEO pages so the site stays fresh every day.
          python src/run.py seo || echo "SEO step skipped"

      - name: Commit report + state + SEO
        run: |
          git config user.name "collabhive-outreach"
          git config user.email "collabhive.in@gmail.com"
          git add -A outreach/data/ seo-pages/ || true
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "build: refresh outreach report + state + SEO [skip ci]"
            # Rebase + push with retry to avoid racing concurrent commits.
            for i in 1 2 3 4 5; do
              git pull --rebase origin "${{ github.ref_name }}" && break || true
            done
            for i in 1 2 3 4 5; do
              git push origin "${{ github.ref_name }}" && break || sleep 20
            done
          fi
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
