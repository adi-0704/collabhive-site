name: Social Daily (top up Buffer queue)

# Keeps both Instagram queues topped up so posts go live at exactly 18:00 IST.
#
# Why a top-up instead of posting one per day:
#   * schedule_all.py pins each post to an exact dueAt, so it publishes at
#     18:00 sharp rather than whenever Buffer's own queue slot happens to be.
#   * Buffer's free plan allows 10 scheduled posts per channel, so this fills
#     up to that cap and stops. That leaves ~10 days of runway — a failed run
#     (or a few) never creates a gap in posting.
#   * Re-runs are safe: already-scheduled posts are detected and skipped.
on:
  schedule:
    # 04:30 IST = 23:00 UTC (previous day). Runs well before the 18:00 IST
    # publish time, so a retry still has the whole day of margin.
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print the plan instead of scheduling'
        type: boolean
        default: false
      post_time:
        description: 'Publish time in IST (HH:MM)'
        required: false
        default: '19:30'

concurrency:
  group: social-daily
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  topup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Top up the Buffer queue
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
        run: |
          if [ -z "$BUFFER_ACCESS_TOKEN" ]; then
            echo "::error::BUFFER_ACCESS_TOKEN secret is not set — nothing was scheduled."
            exit 1
          fi
          TIME="${{ inputs.post_time || '19:30' }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -u social/schedule_all.py --time "$TIME" --dry-run
          else
            python -u social/schedule_all.py --time "$TIME"
          fi
