name: Social Daily (top up Buffer queues)

# Tops up BOTH Instagram streams so each page posts twice a day:
#
#   18:00 IST  static feed post   (social/calendar/calendar.json)
#   19:30 IST  reel               (social/calendar/reels_calendar.json)
#
# The two carry different topics by construction — generate_reels.py fails the
# build if any reel headline or body also appears in the static bank.
#
# Why a top-up instead of publishing one per day:
#   * Each post is pinned to an exact dueAt, so Buffer publishes it on time on
#     its own. If this workflow breaks, everything already queued still goes
#     out — that is the whole point of scheduling rather than posting live.
#   * Buffer's free plan allows 10 scheduled posts per channel, counted across
#     the channel rather than per day. The two streams split it 5/5, giving
#     five days of runway each.
#   * Re-runs are safe: already-scheduled posts are detected and skipped.
on:
  schedule:
    # 04:30 IST = 23:00 UTC (previous day). Runs well before the 18:00 IST
    # publish time, so a retry still has the whole day of margin.
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print the plan instead of scheduling'
        type: boolean
        default: false
      post_time:
        description: 'Static feed publish time in IST (HH:MM)'
        required: false
        default: '18:00'
      reel_time:
        description: 'Reel publish time in IST (HH:MM)'
        required: false
        default: '19:30'

concurrency:
  group: social-daily
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  topup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Top up the static feed queue (18:00 IST)
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
        run: |
          if [ -z "$BUFFER_ACCESS_TOKEN" ]; then
            echo "::error::BUFFER_ACCESS_TOKEN secret is not set — nothing was scheduled."
            exit 1
          fi
          TIME="${{ inputs.post_time || '18:00' }}"
          DRY=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then DRY="--dry-run"; fi
          python -u social/schedule_all.py --time "$TIME" --max-queue 5 $DRY

      - name: Top up the reel queue (19:30 IST)
        # Runs even if the static top-up failed — one stream stalling should not
        # take the other down with it.
        if: always()
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
        run: |
          if [ -z "$BUFFER_ACCESS_TOKEN" ]; then
            echo "::error::BUFFER_ACCESS_TOKEN secret is not set — no reels scheduled."
            exit 1
          fi
          TIME="${{ inputs.reel_time || '19:30' }}"
          DRY=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then DRY="--dry-run"; fi
          python -u social/schedule_reels.py --time "$TIME" --max-queue 5 $DRY
