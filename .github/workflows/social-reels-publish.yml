name: Social Reels (publish daily)

# Publishes one reel per page per day at the peak engagement window.
#
# Separate from social-daily.yml on purpose:
#   * the static feed publishes at 18:00 IST from Buffer's scheduled queue and
#     must not be disturbed - that queue is already built on those dates
#   * reels carry different topics (social/calendar/reels_calendar.json) so the
#     two streams never say the same thing on the same day
#   * Buffer's free plan caps SCHEDULED posts at 10 per channel and the static
#     queue already fills it, so reels publish with shareNow instead, which
#     costs nothing against that cap
on:
  schedule:
    # 14:00 UTC = 19:30 IST. Instagram reel engagement in India peaks across
    # 19:00-21:00 - after the commute, before the night drops off. GitHub's
    # scheduler can drift a few minutes; the window is wide enough that it
    # does not matter.
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print what would publish instead of publishing'
        type: boolean
        default: false
      date:
        description: 'Publish a specific date (YYYY-MM-DD)'
        required: false

concurrency:
  group: social-reels-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish today's reels
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
        run: |
          if [ -z "$BUFFER_ACCESS_TOKEN" ]; then
            echo "::error::BUFFER_ACCESS_TOKEN secret is not set — nothing was published."
            exit 1
          fi
          ARGS=""
          if [ -n "${{ inputs.date }}" ]; then ARGS="--date ${{ inputs.date }}"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python -u social/publish_reel.py $ARGS
