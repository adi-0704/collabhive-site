name: Outreach Tests

on:
  push:
    paths:
      - 'outreach/src/**'
      - 'outreach/config.json'
  pull_request:
    paths:
      - 'outreach/src/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run test suite
        working-directory: outreach
        run: |
          python src/tests.py
