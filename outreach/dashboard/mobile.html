<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1524">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>CollabHive — Mail Monitor</title>
<link rel="icon" href="../../assets/img/logo.png">
<!--
  Mobile-first outreach monitor. Built as a separate page from index.html
  rather than a responsive rewrite of it, because the questions you ask on a
  phone are different: index.html is a full operational readout, this answers
  "is the mail system alive, and did a human reply?" in one screen.

  Reads the same ../data/report.json that the daily workflow commits, so there
  is no server and nothing to deploy — GitHub Pages serves it.

  The headline number is HUMAN replies. The old dashboard showed a reply count
  that included support-desk auto-acknowledgements, which read as 20 hot leads
  when the true figure was zero.
-->
<style>
  :root{
    --bg:#0F1524; --card:#182033; --line:#26314B; --ink:#F2F5FA;
    --dim:#8C9AB5; --honey:#FFC629; --purple:#8B5CF6;
    --good:#34D399; --warn:#FBBF24; --bad:#F87171;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bot:env(safe-area-inset-bottom,0px);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    background:var(--bg);color:var(--ink);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:calc(var(--safe-top) + 14px) 14px calc(var(--safe-bot) + 28px);
    max-width:620px;margin:0 auto;
  }
  header{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  header img{width:30px;height:30px;object-fit:contain}
  h1{font-size:17px;font-weight:700;letter-spacing:-.2px}
  .stamp{color:var(--dim);font-size:12px;margin-bottom:16px}

  /* Verdict banner — the one thing worth seeing at a glance. */
  .verdict{
    border-radius:14px;padding:14px 16px;margin-bottom:16px;
    border:1px solid var(--line);background:var(--card);
    display:flex;gap:12px;align-items:flex-start;
  }
  .verdict .dot{width:10px;height:10px;border-radius:50%;flex:0 0 10px;margin-top:5px}
  .verdict h2{font-size:15px;font-weight:700;margin-bottom:3px}
  .verdict p{font-size:13px;color:var(--dim)}
  .ok .dot{background:var(--good)} .warn .dot{background:var(--warn)} .bad .dot{background:var(--bad)}
  .ok h2{color:var(--good)} .warn h2{color:var(--warn)} .bad h2{color:var(--bad)}

  h3{font-size:12px;text-transform:uppercase;letter-spacing:.9px;color:var(--dim);
     margin:22px 0 9px;font-weight:700}

  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .grid.three{grid-template-columns:repeat(3,1fr)}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px}
  .tile .n{font-size:26px;font-weight:800;letter-spacing:-1px;line-height:1.1}
  .tile .l{font-size:11px;color:var(--dim);margin-top:3px;line-height:1.3}
  .tile .sub{font-size:11px;margin-top:5px}
  .n.good{color:var(--good)} .n.warn{color:var(--warn)} .n.bad{color:var(--bad)}
  .n.honey{color:var(--honey)} .n.purple{color:var(--purple)}

  /* Horizontal share bar — reachability and funnel both use it. */
  .bar{display:flex;height:10px;border-radius:99px;overflow:hidden;margin:10px 0 8px;
       background:#0B1020}
  .bar span{display:block}
  .key{display:flex;flex-wrap:wrap;gap:10px 14px;font-size:11.5px;color:var(--dim)}
  .key i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px}

  .row{background:var(--card);border:1px solid var(--line);border-radius:12px;
       padding:11px 13px;margin-bottom:8px}
  .row .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
  .row .who{font-weight:600;font-size:13.5px;word-break:break-all}
  .row .when{color:var(--dim);font-size:11px;white-space:nowrap}
  .row .txt{color:var(--dim);font-size:12.5px;margin-top:5px}
  .pill{display:inline-block;font-size:10.5px;font-weight:700;padding:2.5px 8px;
        border-radius:99px;text-transform:uppercase;letter-spacing:.4px}
  .p-int{background:rgba(52,211,153,.15);color:var(--good)}
  .p-neg{background:rgba(251,191,36,.15);color:var(--warn)}
  .p-dec{background:rgba(248,113,113,.15);color:var(--bad)}

  .empty{background:var(--card);border:1px dashed var(--line);border-radius:12px;
         padding:18px;text-align:center;color:var(--dim);font-size:13px}
  .note{font-size:12px;color:var(--dim);margin-top:8px;line-height:1.5}
  button{
    width:100%;margin-top:22px;padding:13px;border-radius:12px;border:1px solid var(--line);
    background:var(--card);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;
  }
  button:active{background:#1F2942}
  a{color:var(--honey)}
</style>
</head>
<body>

<header>
  <img src="../../assets/img/logo.png" alt="">
  <h1>Mail Monitor</h1>
</header>
<div class="stamp" id="stamp">loading…</div>

<div id="app"></div>

<button onclick="location.reload()">Refresh</button>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function ago(iso){
  if(!iso) return '';
  const t = new Date(iso); if(isNaN(t)) return '';
  const m = Math.floor((Date.now() - t) / 60000);
  if(m < 1) return 'just now';
  if(m < 60) return m + 'm ago';
  const h = Math.floor(m / 60);
  if(h < 24) return h + 'h ago';
  const d = Math.floor(h / 24);
  return d + 'd ago';
}

function tile(n, label, cls, sub){
  return `<div class="tile"><div class="n ${cls||''}">${esc(n)}</div>
          <div class="l">${esc(label)}</div>
          ${sub ? `<div class="sub">${sub}</div>` : ''}</div>`;
}

// The verdict is deliberately blunt. A dashboard that says "20 leads" when
// every one is a ticket bot is worse than no dashboard.
function verdict(mh, sum){
  const stale = sum.sent_today === 0;
  if(mh.hot_leads > 0)
    return ['ok','Live leads waiting',
      `${mh.hot_leads} brand${mh.hot_leads>1?'s':''} replied by hand. Answer today.`];
  if(stale && sum.remaining_candidates === 0)
    return ['bad','Pool is empty',
      'Nothing sent today and no un-emailed brands are left. Outreach has stopped until the pool is refilled.'];
  if(stale)
    return ['warn','Nothing sent today',
      'The daily run has not delivered yet, or it failed. Check the workflow.'];
  if(mh.human_replies === 0)
    return ['warn','Sending, no human replies yet',
      `${mh.sent_total} emails out, every answer so far automated. Targeting is the thing to fix.`];
  return ['ok','Running normally', `${sum.sent_today} sent today.`];
}

function shareBar(parts){
  const total = parts.reduce((a,p)=>a+p.v,0) || 1;
  const bar = parts.filter(p=>p.v>0).map(p =>
    `<span style="width:${(p.v/total*100).toFixed(2)}%;background:${p.c}"></span>`).join('');
  const key = parts.map(p =>
    `<span><i style="background:${p.c}"></i>${esc(p.k)} ${p.v}</span>`).join('');
  return `<div class="bar">${bar}</div><div class="key">${key}</div>`;
}

fetch('../data/report.json', {cache:'no-store'})
  .then(r => { if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(d => {
    const sum = d.summary || {};
    const mh  = d.mail_health || {};
    const ver = d.verification || {};
    $('#stamp').textContent = 'updated ' + ago(d.generated_at) +
      ' · last run ' + (ago(d.last_run) || '—');

    const [cls, head, why] = verdict(mh, sum);
    let h = `<div class="verdict ${cls}"><div class="dot"></div>
             <div><h2>${esc(head)}</h2><p>${esc(why)}</p></div></div>`;

    // ---- today
    h += `<h3>Today</h3><div class="grid three">`;
    h += tile(sum.sent_today ?? 0, 'sent today',
              (sum.sent_today > 0 ? 'good' : 'bad'));
    h += tile(sum.sent_week ?? 0, 'this week');
    h += tile(sum.daily_budget ?? 18, 'daily limit');
    h += `</div>`;

    // ---- the funnel that matters
    h += `<h3>Replies</h3><div class="grid three">`;
    h += tile(mh.sent_total ?? 0, 'emails sent', 'honey');
    h += tile(mh.human_replies ?? 0, 'HUMAN replies',
              (mh.human_replies > 0 ? 'good' : 'bad'));
    h += tile(mh.hot_leads ?? 0, 'worth answering',
              (mh.hot_leads > 0 ? 'good' : ''));
    h += `</div>`;
    h += `<div class="note">Automated ticket acknowledgements are excluded on
          purpose — they are not replies. Reply rate
          <b>${(mh.reply_rate_pct ?? 0)}%</b>.</div>`;

    // ---- deliverability
    const dr = Number(mh.delivered_pct ?? ver.delivery_rate_pct ?? 0);
    h += `<h3>Delivery</h3><div class="grid three">`;
    h += tile(dr + '%', 'confirmed delivered',
              dr >= 80 ? 'good' : dr >= 50 ? 'warn' : 'bad');
    h += tile(mh.bounces ?? ver.bounces ?? 0, 'bounces',
              (mh.bounces > 0 ? 'warn' : 'good'));
    h += tile(sum.remaining_candidates ?? 0, 'brands left to mail',
              (sum.remaining_candidates > 0 ? '' : 'bad'));
    h += `</div>`;

    // ---- who we can actually reach: the leading indicator
    const rr = mh.reachability || {};
    h += `<h3>Who we can reach</h3>`;
    h += shareBar([
      {k:'decision maker', v:rr.decision_maker||0, c:'#34D399'},
      {k:'named person',   v:rr.named_person||0,   c:'#8B5CF6'},
      {k:'generic inbox',  v:rr.generic||0,        c:'#FFC629'},
      {k:'support desk',   v:rr.support_desk||0,   c:'#F87171'},
      {k:'no email',       v:rr.no_email||0,       c:'#3A465F'},
    ]);
    h += `<div class="note">A pitch sent to a support desk becomes a ticket and
          is closed by someone who cannot approve a campaign. Red is the share
          of the pool that cannot realistically convert.</div>`;

    // ---- real replies
    h += `<h3>Human replies</h3>`;
    const rows = mh.recent_human || [];
    if(!rows.length){
      h += `<div class="empty">No human has replied yet.<br>
            Every response so far was an autoresponder.</div>`;
    } else {
      rows.forEach(r => {
        const p = r.status === 'interested' ? 'p-int'
                : r.status === 'declined'   ? 'p-dec' : 'p-neg';
        h += `<div class="row">
                <div class="top">
                  <span class="who">${esc(r.email)}</span>
                  <span class="when">${esc(ago(r.ts))}</span>
                </div>
                <div style="margin-top:6px"><span class="pill ${p}">${esc(r.status)}</span></div>
                <div class="txt">${esc(r.snippet || r.subject)}</div>
              </div>`;
      });
    }

    // ---- pool
    h += `<h3>Pool</h3><div class="grid">`;
    h += tile(sum.brands_in_pool ?? 0, 'brands in pool');
    h += tile(sum.brands_with_email ?? 0, 'with an address');
    h += `</div>`;

    $('#app').innerHTML = h;
  })
  .catch(e => {
    $('#stamp').textContent = '';
    $('#app').innerHTML =
      `<div class="verdict bad"><div class="dot"></div><div>
         <h2>Cannot load report</h2>
         <p>${esc(e.message)} — the daily workflow may not have committed
         data/report.json yet.</p></div></div>`;
  });
</script>
</body>
</html>
